name: Publish Cinema TMS Admin update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate version and build update package
        shell: pwsh
        run: |
          $version = (python -c "from license_admin.version import __version__; print(__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and app version differ: ${{ github.ref_name }} / $version" }
          ./deployment/build-update-package.ps1
      - name: Create GitHub Release and upload verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $arguments = @("release", "create", $tag, "--title", "Cinema TMS Admin $version", "--generate-notes")
          if ($version -match "(?:a|b|rc)\d+$") { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
          Get-ChildItem -LiteralPath "dist/updates" -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $($_.Name)" }
          }
